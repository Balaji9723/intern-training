<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h3>Signup Form</h3>
    <form action="">
        <label>Name
        <input type="text" name="username"></label>
        <br><br>
        <label>About you
        <textarea name="about_you"></textarea>
        </label>

        <br><br>
        <label>I Like:
        <input type="checkbox" name="like" value="apple"> Apple
        <input type="checkbox" name="like" value="orange"> Orange
        <input type="checkbox" name="like" value="mango"> Mango 
        </label>
        
        <br><br>
        <label> Gender:
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female </label>
        
        <br><br>
        <label>Country
            <select name="country">
                <option value="ja">India</option>
                <option value="us">US</option>
                <option value="uk">UK</option>
            </select>
        </label>
        <br><br>
        <button type="Submit"> Submit</button>

    </form>
</body>
</html>
